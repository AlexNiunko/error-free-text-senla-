plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.4.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.4'
}

apply from: 'version.gradle'

group = 'org.senla'
version = '0.0.1-SNAPSHOT'
description = 'error-free-text'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    jooqVersion = '3.19.23'
    liquibaseVersion = '4.31.1'
    mapstructVersion = '1.6.3'
    lombokVersion = '1.18.30'
    slf4jVersion = '2.0.16'
    postgresVersion = '42.7.8'
    testcontainersVersion = '1.20.1'

    jooqConfig = [
            packageName: 'org.senla.jooq.generated',
            outputDir  : "$buildDir/generated-src/jooq/main",
            changelog  : 'db/changelog/db.changelog-master.xml',
            inputSchema: 'public'
    ]
}

def generatedJooqDir = file(jooqConfig.outputDir)

sourceSets {
    jooqGenerator {
        java {
            srcDir 'src/jooqGenerator/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }

    main {
        java {
            srcDir generatedJooqDir
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

configurations {
    jooqGeneratorImplementation.extendsFrom implementation
    jooqGeneratorCompileOnly.extendsFrom compileOnly
    jooqGeneratorAnnotationProcessor.extendsFrom annotationProcessor
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-jooq"
    implementation "org.apache.httpcomponents.client5:httpclient5"

    implementation "org.jooq:jooq:${jooqVersion}"
    implementation "org.postgresql:postgresql:${postgresVersion}"
    implementation "org.liquibase:liquibase-core:${liquibaseVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    jooqGeneratorImplementation "org.jooq:jooq:${jooqVersion}"
    jooqGeneratorImplementation "org.jooq:jooq-meta:${jooqVersion}"
    jooqGeneratorImplementation "org.jooq:jooq-codegen:${jooqVersion}"
    jooqGeneratorImplementation "org.postgresql:postgresql:${postgresVersion}"
    jooqGeneratorImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    jooqGeneratorImplementation "org.liquibase:liquibase-core:${liquibaseVersion}"
    jooqGeneratorImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('cleanJooq', Delete) {
    group = 'jooq'
    description = 'Deletes generated jOOQ sources.'
    delete generatedJooqDir
}

tasks.register('generateJooq', JavaExec) {
    group = 'jooq'
    description = 'Generates jOOQ sources using Testcontainers + Liquibase in a dedicated JVM process.'

    dependsOn tasks.named('jooqGeneratorClasses')

    classpath = sourceSets.jooqGenerator.runtimeClasspath
    mainClass = 'org.senla.build.JooqGeneratorMain'

    inputs.file(file("src/main/resources/${jooqConfig.changelog}"))
    inputs.dir(file('src/main/resources/db/changelog'))
    outputs.dir(generatedJooqDir)

    args = [
            jooqConfig.packageName,
            generatedJooqDir.absolutePath,
            jooqConfig.changelog,
            jooqConfig.inputSchema
    ]
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateJooq')
}

idea {
    module {
        sourceDirs += generatedJooqDir
        generatedSourceDirs += generatedJooqDir
    }
}