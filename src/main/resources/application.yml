server:
  port: 8080

spring:
  application:
    name: error-free-txt

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jooq:
    sql-dialect: POSTGRES

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

content-size: 10000

